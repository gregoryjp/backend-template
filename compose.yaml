services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional local mailbox UI. Start with: docker compose --profile mail up -d mailpit
  # Then point the app at SMTP localhost:1025 and read mail at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.25
    profiles: ["mail"]
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
